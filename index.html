  font-weight:600; font-style:normal; font-display:block;
}
:root{
  /* Layout: a slim control bar on top, then two (or three) equal timer cards side by side that fill the rest of the window.
     Card states follow a traffic light: white while working, green = close now, orange = hurry, red = too late,
     black from 370. Raise mode adds a cyan "get ready" stage with a 3-2-1 countdown. The count stops at 999. */
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --line:#D9DDE3;
  --line-live:#8A93A1;
  --ink:#0B0D12;
  --muted:#5B6472;
  --accent:#2563EB;
  --ready:#0891B2;  --ready-tint:#CFFAFE;  --ready-deep:#0E7490;
  --green:#16A34A;  --green-tint:#DCFCE7;  --green-strong:#86EFAC;  --green-deep:#15803D;
  --orange:#EA580C; --orange-tint:#FFEDD5; --orange-strong:#FDBA74; --orange-deep:#C2410C;
  --red:#DC2626;
  --note:#991B1B;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:"Case Digits",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --dy:0.0138;
  --ctl:clamp(18px,3vmin,26px);
  color-scheme:light;
}
body{
  --max-w:460px; --max-h:215px;
  --out:3px;
  --gap:4px;
  --pad:3px;
  --tgap:2px;
  --rad:6px;
  --lift:clamp(4px,2.4vh,7px);                 /* how far each stacked card edge shows above a card */
  --btn-h:clamp(36px,21cqh,46px);
  --btn-fs:clamp(12px,7.5cqh,15px);
  --last-fs:clamp(12px,7cqh,14px);
  --dot:clamp(7px,4.4cqh,9px);
}
body.three{--max-w:660px}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  position:relative; margin:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; margin:0; cursor:pointer}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Control bar: its own row, so it can never sit on top of a number. */
.bar{flex:none; display:flex; justify-content:flex-end; align-items:center; gap:calc(var(--ctl) * .3); padding:2px 3px}
.ctl{
  position:relative; display:grid; place-items:center; padding:0;
  width:var(--ctl); height:var(--ctl);
  background:transparent; border:1px solid transparent; border-radius:5px; color:var(--muted);
}
.ctl:hover{color:var(--ink)}
.ctl svg{width:78%; height:78%; display:block}
.gear{display:flex; align-items:center; gap:3px; width:auto; min-width:var(--ctl); justify-content:center}
.gear svg{width:calc(var(--ctl) * .78); height:calc(var(--ctl) * .78)}
.gear[aria-expanded="true"]{color:var(--ink); background:var(--line)}
.tag{
  padding:0 4px; border-radius:3px; background:var(--ink); color:#FFFFFF;
  font-size:10px; font-weight:700; letter-spacing:.06em; line-height:calc(var(--ctl) - 5px);
}
.tag[hidden]{display:none}
#third{border-color:var(--line); background:var(--card)}
#third .minus{display:none}
#third[aria-pressed="true"] .plus{display:none}
#third[aria-pressed="true"] .minus{display:block}
#third[aria-pressed="true"]{color:var(--ink); border-color:var(--line-live)}
#third[data-locked="true"]{opacity:.4}
#mute .x{display:none}
#mute[data-level="off"] .w1, #mute[data-level="off"] .w2{display:none}
#mute[data-level="off"] .x{display:inline}
#mute[data-level="low"] .w2{display:none}
#mute[aria-pressed="true"]{color:var(--ink); background:var(--line)}
body.audio-locked #mute::after{
  content:""; position:absolute; top:0; right:0; width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.volgrp{display:flex; align-items:center; gap:2px}
.vol{
  --th:max(12px,calc(var(--ctl) * .55)); --v:1;
  -webkit-appearance:none; appearance:none; display:block; margin:0; padding:0;
  width:clamp(60px,22vw,160px); height:var(--ctl); background:transparent; cursor:pointer;
}
.vol::-webkit-slider-runnable-track{
  height:4px; border-radius:2px;
  background:linear-gradient(to right, var(--accent) 0 calc(var(--th) / 2 + (100% - var(--th)) * var(--v)), var(--line) 0);
}
.vol::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:var(--th); height:var(--th); margin-top:calc((4px - var(--th)) / 2);
  border:0; border-radius:50%; background:var(--ink);
}
.vol::-moz-range-track{height:4px; border-radius:2px; background:var(--line)}
.vol::-moz-range-progress{height:4px; border-radius:2px; background:var(--accent)}
.vol::-moz-range-thumb{width:var(--th); height:var(--th); border:0; border-radius:50%; background:var(--ink)}
.vol:hover::-webkit-slider-thumb{background:var(--accent)}
.vol:hover::-moz-range-thumb{background:var(--accent)}
.vol:focus{outline:none}
.vol:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:4px}

/* Settings menu: opens under the gear, over the cards, and closes on any click outside it. */
.menu{
  position:absolute; z-index:20; top:calc(var(--ctl) + 6px); right:3px;
  width:max-content; max-width:calc(100% - 6px); max-height:calc(100% - var(--ctl) - 9px); overflow-y:auto;
  padding:4px; background:#FFFFFF; border:1px solid var(--line-live); border-radius:8px;
  box-shadow:0 6px 20px rgba(11,13,18,.18); font-size:12px; line-height:1.2;
}
.menu[hidden]{display:none}
.menu-h{padding:2px 6px 3px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.opt{
  display:flex; align-items:center; gap:7px; width:100%; min-height:24px; padding:2px 8px 2px 6px;
  background:none; border:0; border-radius:5px; text-align:left; font-size:12px; color:var(--ink);
}
.opt:hover{background:#EEF1F5}
.opt:focus-visible{outline-offset:-2px}
.opt .mark{flex:none; width:12px; height:12px; border-radius:50%; border:1.5px solid var(--line-live); background:#FFFFFF}
.opt .mark.box{border-radius:3px}
.opt[aria-checked="true"] .mark{border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 2px #FFFFFF}
.opt-t{font-weight:600}
.opt-s{margin-left:auto; padding-left:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.sep{height:1px; margin:3px 2px; background:var(--line)}

/* The space above the cards is reserved for the stacked edges, so marking a card never moves anything. */
.wrap{
  flex:1 1 0; min-height:0; display:grid; grid-template:minmax(0,1fr) / minmax(0,1fr); place-items:center;
  padding:calc(var(--lift) * 2) var(--out) var(--out);
}
.stage{
  --cols:2;
  container-type:size;
  width:min(100%,var(--max-w)); height:min(94%,var(--max-h));
  display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:var(--gap);
}
body.three .stage{--cols:3}

/* Each state sets the card's colours through these variables. */
.timer{
  --c-bg:var(--card); --c-line:var(--line); --c-num:var(--ink); --c-sub:var(--muted); --c-mark:var(--ink);
  position:relative; display:flex; flex-direction:column; gap:var(--tgap); min-width:0; min-height:0;
  padding:var(--pad); background:var(--c-bg); border:2px solid var(--c-line); border-radius:var(--rad);
}
.timer[hidden]{display:none}
.timer.is-running{--c-line:var(--line-live)}
.timer[data-state="ready"]{--c-bg:var(--ready-tint); --c-line:var(--ready); --c-num:var(--ready-deep); --c-sub:#3B4250; --c-mark:var(--ready-deep)}
.timer[data-state="green"]{--c-bg:var(--green-tint); --c-line:var(--green); --c-num:var(--green-deep); --c-sub:#3B4250; --c-mark:var(--green-deep); animation:pulse-green 1s ease-in-out infinite}
.timer[data-state="orange"]{--c-bg:var(--orange-tint); --c-line:var(--orange); --c-num:var(--orange-deep); --c-sub:#3B4250; --c-mark:var(--orange-deep); animation:pulse-orange .5s ease-in-out infinite}
.timer[data-state="red"]{--c-bg:var(--red); --c-line:#991B1B; --c-num:#FFFFFF; --c-sub:#FFFFFF; --c-mark:#FFFFFF}
.timer[data-state="black"]{--c-bg:#000000; --c-line:#4B5563; --c-num:#FFFFFF; --c-sub:#FFFFFF; --c-mark:#FFFFFF}
/* Green breathes once a second (close now); orange twice as fast (hurry). */
@keyframes pulse-green{0%,100%{background-color:var(--green-tint)} 50%{background-color:var(--green-strong)}}
@keyframes pulse-orange{0%,100%{background-color:var(--orange-tint)} 50%{background-color:var(--orange-strong)}}

/* Multi-sensor: one or two cards peek out above the card, like a small pile. Each is only slightly narrower than the
   one in front, and they sit only above it, so the card and its neighbours keep their size and place.
   They take the card's own colours and border in every state, and pulse with it. */
.timer::before,.timer::after{
  content:""; display:none; position:absolute; z-index:-1; left:max(4px,3.5%); right:max(4px,3.5%); top:calc(-2px - var(--lift)); height:calc(var(--lift) + 8px);
  background:var(--c-bg); border:2px solid var(--c-line); border-bottom:0; border-radius:var(--rad) var(--rad) 0 0;
  animation:inherit;
}
.timer::after{z-index:-2; left:max(8px,7%); right:max(8px,7%); top:calc(-2px - var(--lift) * 2)}
.timer[data-multi="2"]::before,.timer[data-multi="3"]::before,.timer[data-multi="3"]::after{display:block}

.numbox{flex:1 1 0; min-height:0; position:relative; --nb:0px}
.num{
  position:absolute; left:50%; top:calc(50% - var(--nb) / 2);
  transform:translate(-50%,calc(-50% + var(--dy) * 1em));
  font-family:var(--font-num); font-weight:600; font-size:clamp(40px,min(24vw,40vh),600px); line-height:1;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  white-space:nowrap; pointer-events:none; color:var(--c-num);
}
/* "Reset this timer first": under the number inside the third card; the number moves up to make room. */
.note{
  display:none; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:max-content; max-width:100%; padding:.15em .6em; text-align:center; text-wrap:balance;
  font-size:var(--last-fs); font-weight:600; line-height:1.2;
  color:var(--note); background:#FFFFFF; border:1.5px solid var(--note); border-radius:.7em; pointer-events:none;
}
.timer.show-note .note{display:block}

.go{
  position:relative; flex:none; display:flex; align-items:center; justify-content:center; gap:.5em;
  width:100%; height:var(--btn-h); padding:0 8px; overflow:hidden; white-space:nowrap;
  font-size:var(--btn-fs); font-weight:700; letter-spacing:.06em;
  --b-bg:var(--accent); --b-line:var(--accent);
  border-radius:calc(var(--rad) * .7); border:1.5px solid var(--b-line);
  background:var(--b-bg); color:#FFFFFF;
}
.go::before{
  content:""; flex:none; width:.62em; height:.7em; background:currentColor;
  clip-path:polygon(0 0,100% 50%,0 100%);
}
.go:hover{filter:brightness(1.08)}
.go:active{filter:brightness(.92)}
.timer.is-running .go{--b-bg:#FFFFFF; --b-line:var(--ink); color:var(--ink)}
.timer.is-running .go:hover{filter:brightness(.96)}
.timer.is-running .go::before{width:.62em; height:.62em; clip-path:none; border-radius:1px}
/* A message on the button (CLOSE NOW, HURRY, GET READY, 3YE9TI, the countdown): no icon, so the words get the full width. */
.go.msg{padding:0 2px; letter-spacing:.02em}
.timer .go.msg::before{display:none}
.go.count .go-text{font-size:1.7em; line-height:1}
/* Multi-sensor: tiny notches in the top and bottom edges divide the button into 2 or 3 sections. It is still one button.
   The button's fill and border are drawn as one shape, so the border runs into every notch. */
.go .shape{display:none; position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.go .shape path{fill:var(--b-bg); stroke:var(--b-line); stroke-width:1.5; stroke-linejoin:round}
.timer[data-multi="2"] .go,.timer[data-multi="3"] .go{background:transparent; border-color:transparent}
.timer[data-multi="2"] .go .shape,.timer[data-multi="3"] .go .shape{display:block}
.go .go-text,.go::before{position:relative; z-index:1}
.timer[data-multi="2"] .go:focus-visible,.timer[data-multi="3"] .go:focus-visible{outline-offset:1px}

/* Bottom row: last time on the left, sub-case circles on the right. */
.foot{flex:none; display:flex; align-items:center; justify-content:space-between; gap:2px; min-width:0; height:calc(var(--last-fs) * 1.3)}
.last{
  flex:1 1 auto; min-width:0; overflow:hidden; padding-left:2px; text-align:left; white-space:nowrap;
  font-size:var(--last-fs); font-weight:500; line-height:1.3;
  font-variant-numeric:tabular-nums; color:var(--c-sub);
}
.last.compact .last-k{display:none}
.last.compact .val{padding:0 .25em}
.last.bare .val{padding:0; background:none; box-shadow:none; color:inherit}
.last .val{
  display:inline-block; padding:0 .45em; border-radius:.6em; font-weight:700; line-height:1.15;
  background:#E5E7EB; color:var(--ink); box-shadow:0 0 0 1.5px #FFFFFF;
}
.multi{
  position:relative; flex:none; display:flex; align-items:center; gap:2px; height:100%; padding:0 2px 0 1px;
  background:none; border:0; border-radius:8px;
}
.multi::after{content:""; position:absolute; inset:-3px -3px -3px -8px}   /* a bigger target than the dots themselves */
.multi i{display:none; width:var(--dot); height:var(--dot); border-radius:50%; background:var(--c-mark)}
.multi i:first-child{display:block}
.timer[data-multi="1"] .multi i:first-child{background:transparent; border:1.5px solid var(--c-sub)}
.timer[data-multi="2"] .multi i:nth-child(-n+2),.timer[data-multi="3"] .multi i{display:block}
</style>
</head>
<body>
<div class="bar">
  <button class="ctl gear" id="gear" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Settings" title="Settings">
    <span class="tag" id="mode-tag" hidden></span>
    <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M19.64 9.64 L22.41 10.00 L22.41 14.00 L19.64 14.36 L19.08 15.73 L20.78 17.94 L17.94 20.78 L15.73 19.08 L14.36 19.64 L14.00 22.41 L10.00 22.41 L9.64 19.64 L8.27 19.08 L6.06 20.78 L3.22 17.94 L4.92 15.73 L4.36 14.36 L1.59 14.00 L1.59 10.00 L4.36 9.64 L4.92 8.27 L3.22 6.06 L6.06 3.22 L8.27 4.92 L9.64 4.36 L10.00 1.59 L14.00 1.59 L14.36 4.36 L15.73 4.92 L17.94 3.22 L20.78 6.06 L19.08 8.27Z M15.4 12a3.4 3.4 0 1 0-6.8 0a3.4 3.4 0 1 0 6.8 0Z"/></svg>
  </button>
  <button class="ctl" id="third" type="button" aria-pressed="false" aria-label="Add a third timer" title="Add a third timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path class="plus" d="M12 5v14M5 12h14"/><path class="minus" d="M5 12h14"/></svg>
  </button>
  <div class="volgrp">
    <button class="ctl" id="mute" type="button" data-level="off" aria-pressed="true" aria-label="Turn sound on" title="Turn sound on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path class="w1" d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path class="w2" d="M18.3 6.5a8 8 0 0 1 0 11"/><g class="x"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g></svg>
    </button>
    <input class="vol" id="volume" type="range" min="0" max="100" step="1" value="0" aria-label="Alert volume" aria-valuetext="Off" title="Alert volume: Off">
  </div>
</div>

<div class="menu" id="menu" role="menu" aria-label="Settings" hidden>
  <div class="menu-h">Mode</div>
  <button class="opt" id="mode-normal" type="button" role="menuitemradio" aria-checked="true" data-mode="normal"><span class="mark"></span><span class="opt-t">Normal</span><span class="opt-s">closes ≈207</span></button>
  <button class="opt" id="mode-lower" type="button" role="menuitemradio" aria-checked="false" data-mode="lower"><span class="mark"></span><span class="opt-t">Lower AHT</span><span class="opt-s">closes ≈191</span></button>
  <button class="opt" id="mode-raise" type="button" role="menuitemradio" aria-checked="false" data-mode="raise"><span class="mark"></span><span class="opt-t">Raise AHT</span><span class="opt-s">closes 219</span></button>
  <div class="sep"></div>
  <button class="opt" id="opt-hurry" type="button" role="menuitemcheckbox" aria-checked="false"><span class="mark box"></span><span class="opt-t">Hurry chime</span><span class="opt-s">at orange</span></button>
</div>

<div class="wrap">
  <main class="stage" id="stage">
    <section class="timer" aria-label="Timer 1" data-state="base" data-multi="1">
      <div class="numbox"><div class="num" role="timer" aria-label="Timer 1 seconds">0</div></div>
      <button class="go" id="go-1" type="button" aria-label="Start timer 1"><svg class="shape" aria-hidden="true"><path/></svg><span class="go-text">START</span></button>
      <div class="foot"><div class="last"><span class="last-k">Last:</span> –</div><button class="multi" id="multi-1" type="button" aria-label="Sub-cases: 1"><i></i><i></i><i></i></button></div>
    </section>
    <section class="timer" aria-label="Timer 2" data-state="base" data-multi="1">
      <div class="numbox"><div class="num" role="timer" aria-label="Timer 2 seconds">0</div></div>
      <button class="go" id="go-2" type="button" aria-label="Start timer 2"><svg class="shape" aria-hidden="true"><path/></svg><span class="go-text">START</span></button>
      <div class="foot"><div class="last"><span class="last-k">Last:</span> –</div><button class="multi" id="multi-2" type="button" aria-label="Sub-cases: 1"><i></i><i></i><i></i></button></div>
    </section>
    <section class="timer" aria-label="Timer 3" data-state="base" data-multi="1" hidden>
      <div class="numbox"><div class="num" role="timer" aria-label="Timer 3 seconds">0</div><div class="note" role="status">Reset this timer first</div></div>
      <button class="go" id="go-3" type="button" aria-label="Start timer 3"><svg class="shape" aria-hidden="true"><path/></svg><span class="go-text">START</span></button>
      <div class="foot"><div class="last"><span class="last-k">Last:</span> –</div><button class="multi" id="multi-3" type="button" aria-label="Sub-cases: 1"><i></i><i></i><i></i></button></div>
    </section>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* ---------- rules ---------- */
  // Seconds on the timer at which each stage starts. Getting to the case tab takes about 2 s and a close about 6 s to load,
  // so "close now" comes 8 s before the time the case should show as closed.
  const MODES = {
    normal: { name: 'Normal',    tag: '',      go: 199, hurry: 211, over: 214 },   // closes around 207, never after 220
    lower:  { name: 'Lower AHT', tag: 'LOWER', go: 183, hurry: 191, over: 194 },   // closes around 191
    raise:  { name: 'Raise AHT', tag: 'RAISE', ready: 207, go: 213, over: 220 }    // wait on the case, press at 213, closes at 219
  };
  const COUNTDOWN = 3;                              // Raise: the button counts 3-2-1 before "close now"
  const T_BLACK = 370;                              // black card, button reads 3YE9TI
  const T_MAX = 999;                                // the count stops here until RESET
  // A multi-sensor case has 2 or 3 sub-cases to close: every stage starts earlier, by 3 s for the first sub-case
  // and 2 s for each one after it (x2 = 5 s earlier, x3 = 7 s earlier), so the last one still closes on target.
  const shiftFor = n => n > 1 ? 3 + 2 * (n - 1) : 0;
  const KEYS = ['go', 'second'];                    // the two sounds a run can have
  const BASE_TITLE = document.title;
  const CLOSE_TITLE = 'CLOSE Case';
  const NOTE_MS = 3000;
  const CLICK_LOCK_MS = 300;   // a double-click can never reset-then-start (or start-then-reset)
  const MIN_NUM_PX = 40;

  /* ---------- state ---------- */
  const KEY = 'caseTimers.v1';
  const blank = () => ({ running: false, startedAt: null, capped: false, last: null, multi: 1, fired: {} });
  let timers = [blank(), blank(), blank()];
  let three = false;        // third timer shown
  let mode = 'normal';      // never saved: the page always opens in Normal
  let hurryChime = false;   // second chime when a card turns orange
  const PREFS = 2;          // bumped when the sound defaults change, so the new default applies once
  let volume = 0;           // 0 = off, 100 = loudest. The page starts muted.
  let lastVolume = 50;      // restored by the speaker button after muting; the first unmute lands on the middle
  const clampVol = v => Math.min(100, Math.max(0, Math.round(v)));
  // Square-law taper, like a hi-fi volume knob: the middle is a quarter of the signal (about half as loud as max).
  const gainFor = v => v <= 0 ? 0 : Math.pow(v / 100, 2);

  // A capped timer has stopped counting for good: it reads 999 whatever the clock says.
  const elapsed = (t, now) => !t.running ? 0 : t.capped ? T_MAX : Math.min(T_MAX, Math.max(0, Math.floor((now - t.startedAt) / 1000)));
  const anyRunning = () => timers.some(t => t.running && !t.capped);   // still counting

  // This timer's stage times under the current mode and its sub-case count.
  function plan(t) {
    const m = MODES[mode], k = shiftFor(t.multi);
    return mode === 'raise'
      ? { ready: m.ready - k, go: m.go - k, over: m.over - k }
      : { go: m.go - k, hurry: m.hurry - k, over: m.over - k };
  }
  function stageFor(t, s) {
    if (!t.running) return 'base';
    if (s >= T_BLACK) return 'black';
    const p = plan(t);
    if (s >= p.over) return 'red';
    if (p.hurry != null && s >= p.hurry) return 'orange';
    if (s >= p.go) return 'green';
    if (p.ready != null && s >= p.ready) return 'ready';
    return 'base';
  }
  function buttonText(t, s, state) {
    if (!t.running) return 'START';
    switch (state) {
      case 'black': return '3YE9TI';
      case 'green': return t.multi > 1 ? 'CLOSE ×' + t.multi : 'CLOSE NOW';
      case 'orange': return t.multi > 1 ? 'HURRY ×' + t.multi : 'HURRY';
      case 'ready': { const left = plan(t).go - s; return left <= COUNTDOWN ? String(left) : 'GET READY'; }
      default: return 'RESET';
    }
  }
  // The sounds of a run, in time order. Normal and Lower: a chime at green, and (if switched on) a short one at orange.
  // Raise: the chime says "go to the case", then a short beep says "press now".
  function eventsFor(t) {
    const p = plan(t);
    if (mode === 'raise') return [{ key: 'go', at: p.ready, sound: 'go' }, { key: 'second', at: p.go, sound: 'now' }];
    const list = [{ key: 'go', at: p.go, sound: 'go' }];
    if (hurryChime) list.push({ key: 'second', at: p.hurry, sound: 'hurry' });
    return list;
  }
  // A moment that has already passed counts as done: a sound never plays late, and never twice for the same moment.
  function refire(t, now) {
    t.fired = {};
    if (!t.running) return;
    const s = elapsed(t, now);
    for (const ev of eventsFor(t)) t.fired[ev.key] = s >= ev.at;
  }

  function cleanTimer(o) {
    const t = blank();
    if (!o || typeof o !== 'object') return t;
    if (Number.isFinite(o.last) && o.last >= 0) t.last = Math.floor(o.last);
    if (o.multi === 2 || o.multi === 3) t.multi = o.multi;
    if (o.running === true && Number.isFinite(o.startedAt) && o.startedAt > 0) {
      t.running = true;
      t.startedAt = o.startedAt;
      t.capped = o.capped === true;
    }
    return t;
  }
  function readStore() {
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ timers, three, volume, lastVolume, hurryChime, prefs: PREFS })); } catch (e) { /* works without persistence */ }
  }
  function adopt(saved) {
    const list = saved && Array.isArray(saved.timers) ? saved.timers : [];
    timers = [cleanTimer(list[0]), cleanTimer(list[1]), cleanTimer(list[2])];
    three = !!(saved && saved.three === true) || timers[2].running;   // a running third timer is never hidden
    if (!three) timers[2] = blank();
    hurryChime = !!(saved && saved.hurryChime === true);
    if (saved && saved.prefs === PREFS) {
      if (Number.isFinite(saved.volume)) volume = clampVol(saved.volume);
      if (Number.isFinite(saved.lastVolume) && saved.lastVolume > 0) lastVolume = clampVol(saved.lastVolume);
    } else { volume = 0; lastVolume = 50; }   // first open, or settings saved before the louder chime: start muted
    // Moments already passed while the page was closed count as done: never replay them.
    const now = Date.now();
    let changed = false;
    for (const t of timers) {
      refire(t, now);
      if (t.running && elapsed(t, now) >= T_MAX && !t.capped) { t.capped = true; changed = true; }
    }
    return changed;
  }

  /* ---------- elements ---------- */
  const ui = [...document.querySelectorAll('.timer')].map(root => ({
    root,
    numbox: root.querySelector('.numbox'),
    num: root.querySelector('.num'),
    btn: root.querySelector('.go'),
    btnText: root.querySelector('.go-text'),
    last: root.querySelector('.last'),
    note: root.querySelector('.note'),
    multi: root.querySelector('.multi'),
    shape: root.querySelector('.go .shape'),
    shapeKey: '',
    shown: null,
    lockUntil: 0
  }));
  const muteBtn = document.getElementById('mute');
  const thirdBtn = document.getElementById('third');
  const volEl = document.getElementById('volume');
  const gearBtn = document.getElementById('gear');
  const menu = document.getElementById('menu');
  const tagEl = document.getElementById('mode-tag');
  const modeOpts = [...menu.querySelectorAll('[data-mode]')];
  const hurryOpt = document.getElementById('opt-hurry');
  let noteTimer = 0;

  /* ---------- audio (Web Audio only) ---------- */
  let ctx = null, master = null, suspendTimer = 0;
  const sched = [{}, {}, {}];
  const audioOn = () => !!ctx && ctx.state === 'running';

  function ensureAudio() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = gainFor(volume);
        master.connect(ctx.destination);
        ctx.onstatechange = () => { syncAudio(); showAudioHint(); };
      }
      clearTimeout(suspendTimer);
      if (ctx.state !== 'running') {
        const p = ctx.resume();
        if (p && p.then) p.then(() => { syncAudio(); showAudioHint(); }).catch(() => {});
      }
    } catch (e) { /* no sound available */ }
  }
  // Release the audio device while nothing is running.
  function restAudio() {
    clearTimeout(suspendTimer);
    if (!ctx || anyRunning()) return;
    suspendTimer = setTimeout(() => {
      if (ctx && !anyRunning() && ctx.state === 'running') { try { ctx.suspend(); } catch (e) {} }
    }, 4000);
  }

  /* SYNTH-START */
  // Loud but rounded chimes: each note is a sine with one or two softer overtones (a bell-like tone, no buzz),
  // a gentle 15 ms attack, a short hold at full level and a fade. A soft limiter keeps the peaks
  // just under full scale, so it is as loud as the output allows without harsh clipping.
  const CHIMES = {
    go: {                                            // E5 -> B5, rising: time to act
      drive: 1.8, level: 0.97, hold: 0.18,
      notes: [[659.25, 0, 1.7], [987.77, 0.22, 2.1]],
      partials: [[1, 0.6, 1], [2, 0.3, 0.6], [3, 0.14, 0.4]]   // [harmonic, level, share of the fade]
    },
    hurry: {                                         // C6 twice, quick: last chance
      drive: 1.6, level: 0.97, hold: 0.07,
      notes: [[1046.5, 0, 0.42], [1046.5, 0.17, 0.6]],
      partials: [[1, 0.7, 1], [2, 0.22, 0.6]]
    },
    now: {                                           // one short E6: press now
      drive: 1.6, level: 0.97, hold: 0.08,
      notes: [[1318.51, 0, 0.7]],
      partials: [[1, 0.7, 1], [2, 0.2, 0.6]]
    }
  };
  const LIMIT = 3;                                   // limiter input range, in units of full scale
  const softCurve = new Float32Array(2049);
  for (let i = 0; i < softCurve.length; i++) softCurve[i] = Math.tanh((i / 1024 - 1) * LIMIT) / Math.tanh(LIMIT);
  function chime(c, out, t0, p, nodes) {
    const pre = c.createGain(), limiter = c.createWaveShaper(), level = c.createGain();
    pre.gain.value = p.drive / LIMIT;
    limiter.curve = softCurve;
    limiter.oversample = '4x';
    level.gain.value = p.level;
    pre.connect(limiter); limiter.connect(level); level.connect(out);
    let last = null, lastStop = 0;
    for (const [freq, delay, decay] of p.notes) {
      const at = t0 + delay;
      for (const [mult, amp, share] of p.partials) {
        const o = c.createOscillator(), g = c.createGain(), end = at + p.hold + (decay - p.hold) * share;
        o.type = 'sine';
        o.frequency.setValueAtTime(freq * mult, at);
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(amp, at + 0.015);
        g.gain.setValueAtTime(amp, at + p.hold);
        g.gain.exponentialRampToValueAtTime(0.0001, end);
        o.connect(g); g.connect(pre);
        o.start(at); o.stop(end + 0.05);
        nodes.push(o);
        if (end >= lastStop) { last = o; lastStop = end; }
      }
    }
    last.onended = () => { try { level.disconnect(); } catch (e) {} };
  }
  /* SYNTH-END */
  function buildSound(name, at) {
    const nodes = [];
    chime(ctx, master, at, CHIMES[name], nodes);
    return nodes;
  }
  function cancel(s) {
    if (!s) return;
    for (const n of s.nodes) { try { n.onended = null; n.stop(0); } catch (e) {} try { n.disconnect(); } catch (e) {} }
  }
  // Sounds are queued on the audio clock ahead of time, so a throttled background tab still plays them on the second.
  // A change of mode or sub-case count moves or drops the queued sounds here.
  function syncAudio() {
    if (!ctx) return;
    const on = audioOn(), now = Date.now();
    timers.forEach((t, i) => {
      const evs = t.running && !t.capped ? eventsFor(t) : [];
      for (const key of KEYS) {
        const ev = evs.find(e => e.key === key), s = sched[i][key];
        if (!ev || t.fired[key]) {
          if (s && s.at > ctx.currentTime) cancel(s);
          sched[i][key] = null;
          continue;
        }
        if (!on) continue;
        const remain = (t.startedAt + ev.at * 1000 - now) / 1000;
        if (remain <= 0.02) continue;
        const at = ctx.currentTime + remain;
        if (s && s.sound === ev.sound && Math.abs(s.at - at) < 0.1) continue;
        cancel(s);
        try { sched[i][key] = { at, sound: ev.sound, nodes: buildSound(ev.sound, at) }; } catch (e) { sched[i][key] = null; }
      }
    });
  }
  function buzz(name) {
    try { if (navigator.vibrate) navigator.vibrate(name === 'go' ? 120 : name === 'hurry' ? [70, 60, 70] : 60); } catch (e) {}
  }
  // Called once per run and moment, when the clock crosses it.
  function fireAlert(i, ev, state) {
    const queued = sched[i][ev.key];
    sched[i][ev.key] = null;
    if (state === 'red' || state === 'black') { cancel(queued); return; }   // woke up already too late: stay quiet
    buzz(ev.sound);
    if (!audioOn()) { cancel(queued); return; }
    if (queued && queued.sound === ev.sound && queued.at <= ctx.currentTime + 0.35) return;   // the queued sound is playing right now
    cancel(queued);
    try { buildSound(ev.sound, ctx.currentTime + 0.03); } catch (e) {}
  }
  // Plays the main chime at the chosen volume, so the level can be set without waiting for a real alert.
  let preview = null;
  function stopPreview() { if (preview) { cancel(preview); preview = null; } }
  function playPreview() {
    stopPreview();
    if (volume <= 0) return;
    ensureAudio();
    if (!ctx) return;
    const play = () => {
      if (!audioOn() || volume <= 0) return;
      stopPreview();
      const at = ctx.currentTime + 0.03;
      try { preview = { at, nodes: buildSound('go', at) }; } catch (e) { preview = null; }
      restAudio();
    };
    if (audioOn()) play();
    else { try { ctx.resume().then(play, () => {}); } catch (e) {} }
  }
  function showAudioHint() {
    const off = volume === 0;
    const locked = anyRunning() && !off && !audioOn();
    document.body.classList.toggle('audio-locked', locked);
    muteBtn.title = off ? 'Turn sound on' : locked ? 'Click anywhere to turn sound on' : 'Mute sounds';
  }

  /* ---------- screen wake lock ---------- */
  let wake = null, touched = false;
  async function keepAwake() {
    if (!touched || document.visibilityState !== 'visible') return;
    try {
      if ('wakeLock' in navigator && (!wake || wake.released)) wake = await navigator.wakeLock.request('screen');
    } catch (e) { /* unsupported or refused */ }
  }

  /* ---------- rendering ---------- */
  // Number, card state and button text of one timer. Returns true when something needs re-fitting.
  function paintTimer(i, now) {
    const t = timers[i], v = ui[i], s = elapsed(t, now);
    let refit = false;
    if (v.shown !== s) {
      if (String(s).length !== String(v.shown).length) refit = true;
      v.shown = s;
      v.num.textContent = s;
    }
    const state = stageFor(t, s);
    if (v.root.dataset.state !== state) v.root.dataset.state = state;
    const text = buttonText(t, s, state);
    if (v.btnText.textContent !== text) {
      v.btnText.textContent = text;
      v.btn.classList.toggle('msg', text !== 'START' && text !== 'RESET');
      v.btn.classList.toggle('count', text.length === 1);
      refit = true;
    }
    return refit;
  }
  function paintNumbers(now) {
    let refit = false;
    timers.forEach((_, i) => { if (paintTimer(i, now)) refit = true; });
    paintTitle(now);
    if (refit) fit();
  }
  // While any card is green or orange the tab title reads "CLOSE Case" with a square that blinks once a second.
  function paintTitle(now) {
    let s = -1;
    for (const t of timers) {
      if (!t.running) continue;
      const e = elapsed(t, now), state = stageFor(t, e);
      if (state === 'green' || state === 'orange') { s = e; break; }
    }
    const want = s < 0 ? BASE_TITLE : (s % 2 ? '\u{1F7E7} ' : '⬜ ') + CLOSE_TITLE;
    if (document.title !== want) document.title = want;
  }
  function paintPanel(i) {
    const t = timers[i], v = ui[i];
    v.root.classList.toggle('is-running', t.running);
    v.root.dataset.multi = String(t.multi);
    drawShape(v, t.multi);
    v.btn.setAttribute('aria-label', (t.running ? 'Reset timer ' : 'Start timer ') + (i + 1));
    const next = t.multi % 3 + 1;
    v.multi.setAttribute('aria-label', 'Sub-cases: ' + t.multi);
    v.multi.title = t.multi === 1 ? 'Normal case. Click to mark 2 sub-cases' : t.multi + ' sub-cases. Click for ' + (next === 1 ? 'a normal case' : next + ' sub-cases');
    v.last.textContent = '';
    const k = document.createElement('span');
    k.className = 'last-k';
    k.textContent = 'Last:';
    v.last.append(k, ' ');
    if (t.last == null) v.last.append('–');
    else {
      const chip = document.createElement('span');   // always grey, whatever the time was
      chip.className = 'val';
      chip.textContent = t.last + 's';
      v.last.append(chip);
    }
  }
  function paintControls() {
    paintVolume();
    showAudioHint();
  }
  function paintVolume() {
    const off = volume === 0, txt = off ? 'Off' : volume + '%';
    if (+volEl.value !== volume) volEl.value = volume;
    volEl.style.setProperty('--v', String(volume / 100));
    volEl.setAttribute('aria-valuetext', txt);
    volEl.title = 'Alert volume: ' + txt;
    muteBtn.dataset.level = off ? 'off' : volume < 50 ? 'low' : 'high';
    muteBtn.setAttribute('aria-pressed', String(off));
    muteBtn.setAttribute('aria-label', off ? 'Turn sound on' : 'Mute sounds');
    if (master) master.gain.value = gainFor(volume);
  }
  function paintSettings() {
    modeOpts.forEach(o => o.setAttribute('aria-checked', String(o.dataset.mode === mode)));
    hurryOpt.setAttribute('aria-checked', String(hurryChime));
    const tag = MODES[mode].tag;
    tagEl.hidden = !tag;
    tagEl.textContent = tag;
    const label = 'Settings. Mode: ' + MODES[mode].name;
    gearBtn.setAttribute('aria-label', label);
    gearBtn.title = label;
  }
  function openMenu(open) {
    menu.hidden = !open;
    gearBtn.setAttribute('aria-expanded', String(open));
  }
  function paintThird() {
    document.body.classList.toggle('three', three);
    ui[2].root.hidden = !three;
    if (!three) hideNote();
    const locked = three && timers[2].running;
    thirdBtn.setAttribute('aria-pressed', String(three));
    thirdBtn.dataset.locked = String(locked);
    const label = !three ? 'Add a third timer' : locked ? 'Reset the third timer first' : 'Remove the third timer';
    thirdBtn.setAttribute('aria-label', label);
    thirdBtn.title = label;
  }
  function showNote() {
    ui[2].root.classList.add('show-note');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(hideNote, NOTE_MS);
    fit();
  }
  function hideNote() {
    clearTimeout(noteTimer);
    if (!ui[2].root.classList.contains('show-note')) return;
    ui[2].root.classList.remove('show-note');
    fit();
  }
  function paintAll() {
    paintControls();
    paintSettings();
    paintThird();
    ui.forEach((_, i) => paintPanel(i));
    paintNumbers(Date.now());
    fit();
  }

  /* ---------- auto-fit ---------- */
  // Digit metrics in em (defaults match the embedded font; re-measured once fonts are ready).
  const M = { cell: 0.5029, ink: 0.7307, dy: 0.0138 };
  function measure() {
    try {
      const c = document.createElement('canvas').getContext('2d');
      c.font = '600 200px ' + getComputedStyle(ui[0].num).fontFamily;
      let w = 0;
      for (const d of '0123456789') w = Math.max(w, c.measureText(d).width);
      const m = c.measureText('0123456789');
      const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
      if (w > 0 && asc > 0 && Number.isFinite(desc)) {
        M.cell = w / 200;
        M.ink = (asc + desc) / 200;
        const A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
        M.dy = (Number.isFinite(A) && Number.isFinite(D)) ? ((asc - desc) - (A - D)) / 400 : 0;
      }
    } catch (e) { /* keep defaults */ }
    document.documentElement.style.setProperty('--dy', M.dy.toFixed(4));
  }
  // Rounded rectangle with small V notches on the top and bottom edges, in the button's own pixels.
  const NOTCH_W = 3, NOTCH_D = 3;
  function drawShape(v, n) {
    const w = v.btn.offsetWidth, h = v.btn.offsetHeight;
    if (n < 2 || !w || !h) return;
    const key = w + 'x' + h + 'x' + n;
    if (v.shapeKey === key) return;
    v.shapeKey = key;
    const i = 0.75, r = Math.min(parseFloat(getComputedStyle(v.btn).borderTopLeftRadius) || 4, h / 2), x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    const cuts = [];
    for (let k = 1; k < n; k++) cuts.push(Math.round(w * k / n * 2) / 2);
    let d = `M${x0 + r} ${y0}`;
    for (const c of cuts) d += ` L${c - NOTCH_W} ${y0} L${c} ${y0 + NOTCH_D} L${c + NOTCH_W} ${y0}`;
    d += ` L${x1 - r} ${y0} Q${x1} ${y0} ${x1} ${y0 + r} L${x1} ${y1 - r} Q${x1} ${y1} ${x1 - r} ${y1}`;
    for (const c of cuts.slice().reverse()) d += ` L${c + NOTCH_W} ${y1} L${c} ${y1 - NOTCH_D} L${c - NOTCH_W} ${y1}`;
    d += ` L${x0 + r} ${y1} Q${x0} ${y1} ${x0} ${y1 - r} L${x0} ${y0 + r} Q${x0} ${y0} ${x0 + r} ${y0}Z`;
    v.shape.setAttribute('viewBox', `0 0 ${w} ${h}`);
    v.shape.firstChild.setAttribute('d', d);
  }
  function fit() {
    timers.forEach((t, i) => drawShape(ui[i], t.multi));
    for (const v of ui) {
      const W = v.numbox.clientWidth, H0 = v.numbox.clientHeight;
      if (!W || !H0) continue;
      // The number takes all the room the card has; the note under it (third card only) pushes it up.
      const nb = v.note && v.root.classList.contains('show-note') ? v.note.offsetHeight + 3 : 0;
      v.numbox.style.setProperty('--nb', nb + 'px');
      const H = Math.max(1, H0 - nb);
      const digits = Math.max(3, String(v.shown == null ? 0 : v.shown).length);
      const px = Math.min(W * 0.92 / (digits * M.cell), H * 0.9 / M.ink);
      v.num.style.fontSize = Math.max(MIN_NUM_PX, Math.floor(px)) + 'px';
      // A message longer than the button (CLOSE NOW, GET READY on a narrow card) shrinks just enough to fit.
      v.btnText.style.fontSize = '';
      if (v.btn.classList.contains('msg') && !v.btn.classList.contains('count')) {
        const room = v.btn.clientWidth - 8, need = v.btnText.offsetWidth;
        if (need > room) v.btnText.style.fontSize = Math.max(8, Math.floor(parseFloat(getComputedStyle(v.btn).fontSize) * room / need * 10) / 10) + 'px';
      }
      // On a narrow card the word "Last:" gives way, so the time itself is never cut off.
      v.last.classList.remove('compact', 'bare');
      if (v.last.scrollWidth > v.last.clientWidth) v.last.classList.add('compact');
      if (v.last.scrollWidth > v.last.clientWidth) v.last.classList.add('bare');     // narrowest cards: the plain time, no badge
    }
  }
  let fitQueued = false;
  function queueFit() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fit(); });
  }

  /* ---------- clock ---------- */
  let tickTimer = 0;
  function tick() {
    const now = Date.now();
    let dirty = false, capped = false;
    timers.forEach((t, i) => {
      if (!t.running || t.capped) return;
      const s = elapsed(t, now);
      let due = null;                     // if several moments passed at once (a frozen tab), only the latest one sounds
      for (const ev of eventsFor(t)) {
        if (s < ev.at || t.fired[ev.key]) continue;
        t.fired[ev.key] = true;
        if (due) { cancel(sched[i][due.key]); sched[i][due.key] = null; }
        due = ev;
      }
      if (due) fireAlert(i, due, stageFor(t, s));
      if (s >= T_MAX && !t.capped) { t.capped = true; dirty = true; capped = true; }
    });
    if (dirty) save();
    paintNumbers(now);
    syncAudio();
    arm();
    if (capped) restAudio();
  }
  // Wake up right after the next whole second of whichever timer is still counting. A capped timer needs no clock.
  function arm() {
    clearTimeout(tickTimer); tickTimer = 0;
    const now = Date.now();
    let wait = Infinity;
    for (const t of timers) {
      if (!t.running || t.capped) continue;
      const into = ((now - t.startedAt) % 1000 + 1000) % 1000;
      wait = Math.min(wait, 1000 - into);
    }
    if (wait !== Infinity) tickTimer = setTimeout(tick, Math.min(1000, Math.max(8, wait + 4)));
  }

  /* ---------- actions ---------- */
  function start(i) {
    const t = timers[i];
    t.running = true;
    t.startedAt = Date.now();
    t.capped = false;
    t.fired = {};
    save();
    paintPanel(i);
    if (i === 2) paintThird();
    ensureAudio();
    tick();
  }
  function reset(i) {
    const t = timers[i];
    t.last = elapsed(t, Date.now());
    t.running = false;
    t.startedAt = null;
    t.capped = false;
    t.multi = 1;     // the next case starts as a normal one
    t.fired = {};
    save();
    paintPanel(i);
    if (i === 2) { hideNote(); paintThird(); }
    tick();          // repaints 0, drops this timer's queued sounds, never starts anything
    restAudio();
  }
  // After a change of mode, sub-case count or chime setting: nothing that already passed may sound, the rest is re-queued.
  function replan(list) {
    const now = Date.now();
    for (const t of list) refire(t, now);
    paintNumbers(now);
    fit();
    syncAudio();
  }

  ui.forEach((v, i) => {
    v.btn.addEventListener('click', e => {
      const now = performance.now();
      if (now < v.lockUntil) return;
      v.lockUntil = now + CLICK_LOCK_MS;
      if (timers[i].running) reset(i); else start(i);
      if (e.detail > 0) v.btn.blur();   // a stray Space/Enter later can't press it again
      showAudioHint();
    });
    // Circles: 1 (normal case) -> 2 -> 3 sub-cases -> back to 1.
    v.multi.addEventListener('click', e => {
      tick();
      const t = timers[i];
      t.multi = t.multi % 3 + 1;
      save();
      paintPanel(i);
      replan([t]);
      if (e.detail > 0) v.multi.blur();
    });
  });
  // One button adds the third timer and removes it again. A running third timer can't be removed: its card says why.
  thirdBtn.addEventListener('click', e => {
    if (e.detail > 0) thirdBtn.blur();
    if (three && timers[2].running) { showNote(); return; }
    three = !three;
    timers[2] = blank();
    ui[2].shown = null;
    save();
    paintThird();
    paintPanel(2);
    paintNumbers(Date.now());
    fit();
    syncAudio();
  });
  muteBtn.addEventListener('click', e => {
    if (volume > 0) { lastVolume = volume; volume = 0; stopPreview(); }
    else volume = lastVolume > 0 ? lastVolume : 50;
    save();
    paintControls();
    if (e.detail > 0) muteBtn.blur();
  });
  // Dragging changes the level live; letting go saves it and plays the chime at that level.
  volEl.addEventListener('input', () => {
    volume = clampVol(+volEl.value);
    if (volume === 0) stopPreview();
    paintControls();
  });
  volEl.addEventListener('change', () => {
    volume = clampVol(+volEl.value);
    if (volume > 0) lastVolume = volume;
    save();
    paintControls();
    playPreview();
  });
  volEl.addEventListener('pointerup', () => setTimeout(() => volEl.blur(), 0));

  // Settings: the mode applies at once, to running timers too, and is forgotten when the page is closed.
  gearBtn.addEventListener('click', e => {
    openMenu(menu.hidden);
    if (e.detail > 0) gearBtn.blur();
  });
  modeOpts.forEach(o => o.addEventListener('click', () => {
    tick();
    mode = o.dataset.mode;
    paintSettings();
    replan(timers);
    openMenu(false);
  }));
  hurryOpt.addEventListener('click', e => {
    tick();
    hurryChime = !hurryChime;
    save();
    paintSettings();
    replan(timers);
    if (e.detail > 0) hurryOpt.blur();
  });
  document.addEventListener('click', e => {
    if (!menu.hidden && !menu.contains(e.target) && !gearBtn.contains(e.target)) openMenu(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) openMenu(false); });

  // First click anywhere unlocks audio and the wake lock (runs before the button's own handler).
  document.addEventListener('click', () => {
    touched = true;
    if (!ctx || anyRunning()) ensureAudio();
    restAudio();
    keepAwake();
    setTimeout(showAudioHint, 500);
  }, true);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    tick();
    keepAwake();
    queueFit();
  });
  window.addEventListener('pageshow', () => { tick(); queueFit(); });
  window.addEventListener('resize', queueFit);
  if ('ResizeObserver' in window) new ResizeObserver(queueFit).observe(document.getElementById('stage'));

  // Another window of this page changed the timers: follow it.
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    if (adopt(readStore())) save();
    paintAll();
    tick();
    restAudio();
  });

  /* ---------- boot ---------- */
  if (adopt(readStore())) save();
  paintAll();
  tick();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 100px "Case Digits"', '0123456789').then(() => { measure(); fit(); }, () => { measure(); fit(); });
  } else { measure(); fit(); }
})();
</script>
</body>
</html>
