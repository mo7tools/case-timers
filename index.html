:root{
  /* Layout: a slim control bar on top, then one, two or three equal timer cards side by side that fill the rest of the window.
     Card states follow a traffic light: white while working, green = close now, orange = hurry, red = too late,
     black from 370. Raise mode adds a cyan "get ready" stage with a 3-2-1 countdown. The count stops at 999. */
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --line:#D9DDE3;
  --line-live:#8A93A1;
  --ink:#0B0D12;
  --muted:#5B6472;
  --accent:#2563EB;
  --ready:#0891B2;  --ready-tint:#CFFAFE;  --ready-deep:#0E7490;
  --green:#16A34A;  --green-tint:#DCFCE7;  --green-strong:#86EFAC;  --green-deep:#15803D;
  --orange:#EA580C; --orange-tint:#FFEDD5; --orange-strong:#FDBA74; --orange-deep:#C2410C;
  --red:#DC2626;
  --note:#991B1B;
  --font-ui:"Case UI","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:"Case Digits",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --dy:0.0138;
  --ctl:clamp(17px,2.8vmin,24px);
  --p0:#ECE8F2;                                  /* progress track */
  --p-ink:#5B21B6;
  color-scheme:light;
}
body{
  --max-w:460px; --max-h:215px;
  --out:3px;
  --gap:4px;
  --pad:3px;
  --tgap:2px;
  --rad:6px;
  --lift:clamp(4px,2.4vh,7px);                 /* how far each stacked card edge shows above a card */
  --btn-h:clamp(36px,21cqh,46px);
  --btn-fs:13px;
  --last-fs:12px;
  --foot-h:20px;
  --dot:clamp(6px,4cqh,8px);
}
body.three{--max-w:660px}
body.one{--max-w:300px}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  position:relative; margin:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  font-synthesis:none; font-kerning:normal;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; margin:0; cursor:pointer}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Control bar: its own row, so it can never sit on top of a number. */
.bar{flex:none; display:flex; justify-content:flex-end; align-items:center; gap:calc(var(--ctl) * .25); padding:6px 3px 0}

/* Case tally: a thin progress bar along the top edge of the window, and the count at the left of the control bar.
   The bar deepens from pastel to royal purple at 25%, 50%, 75% and 100% of the day's goal. */
.prog{position:absolute; z-index:15; top:0; left:0; right:0; height:4px; background:var(--p0); pointer-events:none}
.prog i{display:block; height:100%; width:0; background:#E4D4FB; border-radius:0 2px 2px 0; transition:width .4s ease, background-color .4s ease}
.prog[data-level="1"] i{background:#D2B6FA}
.prog[data-level="2"] i{background:#B98AF5}
.prog[data-level="3"] i{background:#9452E6}
.prog[data-level="4"] i{background:#6B21A8}
.prog.glow i{animation:prog-glow 1.6s ease-out}
@keyframes prog-glow{0%{box-shadow:0 0 0 0 rgba(124,58,237,0)} 25%{box-shadow:0 0 9px 3px rgba(124,58,237,.75)} 100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.tally{
  margin-right:auto; height:var(--ctl); padding:0 6px; display:flex; align-items:center; white-space:nowrap;
  background:#F3EEFB; border:1px solid #DCCDF5; border-radius:calc(var(--ctl) / 2); color:var(--p-ink);
  font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:0;
}
.tally:hover{border-color:#B98AF5}
.tally .of{font-weight:500; color:#7C6A9A}
.tally[data-mode="stretch"]{font-weight:700}
.tally[data-mode="flash"]{background:#6B21A8; border-color:#6B21A8; color:#FFFFFF; font-weight:700}
.tally[data-mode="done"]{background:#6B21A8; border-color:#6B21A8; color:#FFFFFF; font-weight:700}
.ctl{
  position:relative; display:grid; place-items:center; padding:0;
  width:var(--ctl); height:var(--ctl);
  background:transparent; border:1px solid transparent; border-radius:5px; color:var(--muted);
}
.ctl:hover{color:var(--ink)}
.ctl svg{width:78%; height:78%; display:block}
.gear{display:flex; align-items:center; gap:3px; width:auto; min-width:var(--ctl); justify-content:center}
.gear svg{width:calc(var(--ctl) * .78); height:calc(var(--ctl) * .78)}
.gear[aria-expanded="true"]{color:var(--ink); background:var(--line)}
.tag{
  padding:0 4px; border-radius:3px; background:var(--ink); color:#FFFFFF;
  font-size:10px; font-weight:700; letter-spacing:.04em; line-height:calc(var(--ctl) - 5px);
}
.tag[hidden]{display:none}
#third{border-color:var(--line); background:var(--card)}
#third .minus{display:none}
#third[aria-pressed="true"] .plus{display:none}
#third[aria-pressed="true"] .minus{display:block}
#third[aria-pressed="true"]{color:var(--ink); border-color:var(--line-live)}
#third[data-locked="true"]{opacity:.4}
#mute .x{display:none}
#mute[data-level="off"] .w1, #mute[data-level="off"] .w2{display:none}
#mute[data-level="off"] .x{display:inline}
#mute[data-level="low"] .w2{display:none}
#mute[aria-pressed="true"]{color:var(--ink); background:var(--line)}
body.audio-locked #mute::after{
  content:""; position:absolute; top:0; right:0; width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.vol{
  --th:13px; --v:1;
  -webkit-appearance:none; appearance:none; display:block; margin:0; padding:0;
  flex:1 1 auto; min-width:70px; height:22px; background:transparent; cursor:pointer;
}
.vol::-webkit-slider-runnable-track{
  height:4px; border-radius:2px;
  background:linear-gradient(to right, var(--accent) 0 calc(var(--th) / 2 + (100% - var(--th)) * var(--v)), var(--line) 0);
}
.vol::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:var(--th); height:var(--th); margin-top:calc((4px - var(--th)) / 2);
  border:0; border-radius:50%; background:var(--ink);
}
.vol::-moz-range-track{height:4px; border-radius:2px; background:var(--line)}
.vol::-moz-range-progress{height:4px; border-radius:2px; background:var(--accent)}
.vol::-moz-range-thumb{width:var(--th); height:var(--th); border:0; border-radius:50%; background:var(--ink)}
.vol:hover::-webkit-slider-thumb{background:var(--accent)}
.vol:hover::-moz-range-thumb{background:var(--accent)}
.vol:focus{outline:none}
.vol:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:4px}

/* Settings menu: opens under the gear, over the cards, and closes on any click outside it. */
.menu{
  position:absolute; z-index:20; top:calc(var(--ctl) + 8px); right:3px;
  width:max-content; max-width:calc(100% - 6px); max-height:calc(100% - var(--ctl) - 11px); overflow-y:auto;
  padding:4px; background:#FFFFFF; border:1px solid var(--line-live); border-radius:8px;
  box-shadow:0 6px 20px rgba(11,13,18,.18); font-size:12px; line-height:1.2;
}
.menu[hidden]{display:none}
.menu-h{padding:2px 6px 3px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.opt{
  display:flex; align-items:center; gap:7px; width:100%; min-height:24px; padding:1px 8px 1px 6px;
  background:none; border:0; border-radius:5px; text-align:left; font-size:12px; color:var(--ink);
}
.opt:hover{background:#EEF1F5}
.opt:focus-visible{outline-offset:-2px}
.opt .mark{flex:none; width:12px; height:12px; border-radius:50%; border:1.5px solid var(--line-live); background:#FFFFFF}
.opt .mark.box{border-radius:3px}
.opt[aria-checked="true"] .mark{border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 2px #FFFFFF}
.opt-t{font-weight:600}
.opt-s{margin-left:auto; padding-left:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.sep{height:1px; margin:3px 2px; background:var(--line)}
.row{display:flex; align-items:center; gap:7px; min-height:26px; padding:1px 6px}
.row-k{flex:none; width:52px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.row-v{flex:none; min-width:34px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
.segs{display:flex; flex:1 1 auto; border:1px solid var(--line-live); border-radius:6px; overflow:hidden}
.sb{flex:1 1 auto; min-height:22px; padding:2px 8px; border:0; border-left:1px solid var(--line); background:#FFFFFF; font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap}
.sb:first-child{border-left:0}
.sb:hover{background:#EEF1F5}
.sb[aria-checked="true"]{background:var(--ink); color:#FFFFFF}
.sb:focus-visible{outline-offset:-2px}
.small-btn{margin-left:auto; min-height:22px; padding:2px 10px; border:1px solid var(--line-live); border-radius:6px; background:#FFFFFF; font-size:12px; font-weight:600}
.small-btn:hover{background:#EEF1F5}
.small-btn.armed{background:#991B1B; border-color:#991B1B; color:#FFFFFF}
.menu-msg{margin:0 6px 2px 64px; font-size:11px; font-weight:600; color:var(--note)}
.menu-msg[hidden]{display:none}

/* The space above the cards is reserved for the stacked edges, so marking a card never moves anything. */
.wrap{
  flex:1 1 0; min-height:0; display:grid; grid-template:minmax(0,1fr) / minmax(0,1fr); place-items:center;
  padding:calc(var(--lift) * 2 + 3px) var(--out) var(--out);
}
.stage{
  --cols:2;
  container-type:size;
  width:min(100%,var(--max-w)); height:min(100%,var(--max-h));
  display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:var(--gap);
}
body.three .stage{--cols:3}
body.one .stage{--cols:1}

/* Each state sets the card's colours through these variables. */
.timer{
  --c-bg:var(--card); --c-line:var(--line); --c-num:var(--ink); --c-sub:var(--muted); --c-mark:var(--ink);
  position:relative; display:flex; flex-direction:column; gap:var(--tgap); min-width:0; min-height:0;
  padding:var(--pad); background:var(--c-bg); border:2px solid var(--c-line); border-radius:var(--rad);
}
.timer[hidden]{display:none}
.timer.is-running{--c-line:var(--line-live)}
.timer[data-state="ready"]{--c-bg:var(--ready-tint); --c-line:var(--ready); --c-num:var(--ready-deep); --c-sub:#3B4250; --c-mark:var(--ready-deep)}
.timer[data-state="green"]{--c-bg:var(--green-tint); --c-line:var(--green); --c-num:var(--green-deep); --c-sub:#3B4250; --c-mark:var(--green-deep); animation:pulse-green 1s ease-in-out infinite}
.timer[data-state="orange"]{--c-bg:var(--orange-tint); --c-line:var(--orange); --c-num:var(--orange-deep); --c-sub:#3B4250; --c-mark:var(--orange-deep); animation:pulse-orange .5s ease-in-out infinite}
.timer[data-state="red"]{--c-bg:var(--red); --c-line:#991B1B; --c-num:#FFFFFF; --c-sub:#FFFFFF; --c-mark:#FFFFFF}
.timer[data-state="black"]{--c-bg:#000000; --c-line:#4B5563; --c-num:#FFFFFF; --c-sub:#FFFFFF; --c-mark:#FFFFFF}
/* Green breathes once a second (close now); orange twice as fast (hurry). */
.timer.calm[data-state="green"]{animation:none}
@keyframes pulse-green{0%,100%{background-color:var(--green-tint)} 50%{background-color:var(--green-strong)}}
@keyframes pulse-orange{0%,100%{background-color:var(--orange-tint)} 50%{background-color:var(--orange-strong)}}

/* Multi-sensor: one or two cards peek out above the card, like a small pile. Each is only slightly narrower than the
   one in front, and they sit only above it, so the card and its neighbours keep their size and place.
   They take the card's own colours and border in every state, and pulse with it. */
.timer::before,.timer::after{
  content:""; display:none; position:absolute; z-index:-1; left:max(4px,3.5%); right:max(4px,3.5%); top:calc(-2px - var(--lift)); height:calc(var(--lift) + 8px);
  background:var(--c-bg); border:2px solid var(--c-line); border-bottom:0; border-radius:var(--rad) var(--rad) 0 0;
  animation:inherit;
}
.timer::after{z-index:-2; left:max(8px,7%); right:max(8px,7%); top:calc(-2px - var(--lift) * 2)}
.timer[data-multi="2"]::before,.timer[data-multi="3"]::before,.timer[data-multi="3"]::after{display:block}

.numbox{flex:1 1 0; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden}
.num{
  position:relative; top:var(--num-dy,0px);
  font-family:var(--font-num); font-weight:600; font-size:clamp(40px,min(24vw,40vh),600px); line-height:1;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  white-space:nowrap; pointer-events:none; color:var(--c-num);
}
/* Undo: for 5 s after a reset, over the bottom row of the card, so the number never moves or shrinks. */
.undo{
  position:absolute; z-index:2; inset:0; overflow:hidden;
  display:flex; align-items:center; justify-content:center; gap:5px; padding:0 8px; white-space:nowrap;
  background:var(--ink); color:#FFFFFF; border:0; border-radius:calc(var(--foot-h) / 2); font-size:12px; font-weight:700; letter-spacing:.03em;
}
.undo[hidden]{display:none}
.undo:hover{background:#2B3140}
.undo::after{content:""; position:absolute; left:0; bottom:0; height:2px; width:100%; background:#B98AF5; transform-origin:left; animation:undo-run var(--undo-ms,5000ms) linear forwards}
@keyframes undo-run{to{transform:scaleX(0)}}

.go{
  position:relative; flex:none; display:flex; align-items:center; justify-content:center; gap:.5em;
  width:100%; height:var(--btn-h); padding:0 8px; overflow:hidden; white-space:nowrap;
  font-size:var(--btn-fs); font-weight:700; letter-spacing:.03em;
  --b-bg:var(--accent); --b-line:var(--accent);
  border-radius:calc(var(--rad) * .7); border:1.5px solid var(--b-line);
  background:var(--b-bg); color:#FFFFFF;
}
.go::before{
  content:""; flex:none; width:.62em; height:.7em; background:currentColor;
  clip-path:polygon(0 0,100% 50%,0 100%);
}
.go:hover{filter:brightness(1.08)}
.go:active{filter:brightness(.92)}
.timer.is-running .go{--b-bg:#FFFFFF; --b-line:var(--ink); color:var(--ink)}
.timer.is-running .go:hover{filter:brightness(.96)}
.timer.is-running .go::before{width:.62em; height:.62em; clip-path:none; border-radius:1px}
/* A message on the button (CLOSE NOW, HURRY, GET READY, 3YE9TI, the countdown): no icon, so the words get the full width. */
.go.msg{padding:0 2px; letter-spacing:.01em}
.timer .go.msg::before{display:none}
.go.count .go-text{font-size:22px; line-height:1}
/* Multi-sensor: tiny notches in the top and bottom edges divide the button into 2 or 3 sections. It is still one button.
   The button's fill and border are drawn as one shape, so the border runs into every notch. */
.go .shape{display:none; position:absolute; left:-1.5px; top:-1.5px; width:calc(100% + 3px); height:calc(100% + 3px); overflow:visible; pointer-events:none}
.go .shape path{fill:var(--b-bg); stroke:var(--b-line); stroke-width:1.5; stroke-linejoin:round}
.timer[data-multi="2"] .go,.timer[data-multi="3"] .go{background:transparent; border-color:transparent; overflow:visible}
.timer[data-multi="2"] .go .shape,.timer[data-multi="3"] .go .shape{display:block}
.go .go-text,.go::before{position:relative; z-index:1}
.timer[data-multi="2"] .go:focus-visible,.timer[data-multi="3"] .go:focus-visible{outline-offset:1px}

/* Bottom row: last time on the left, sub-case circles on the right. */
.foot{position:relative; flex:none; display:flex; align-items:center; justify-content:space-between; gap:2px; min-width:0; height:var(--foot-h)}
.last{
  flex:1 1 auto; min-width:0; overflow:hidden; padding-left:2px; text-align:left; white-space:nowrap;
  font-size:var(--last-fs); font-weight:500; line-height:var(--foot-h);
  font-variant-numeric:tabular-nums; color:var(--c-sub);
}
.last.compact .last-k{display:none}
.last.compact .val{padding:0 .25em}
.last.bare .val{padding:0; background:none; box-shadow:none; color:inherit}
.last .val{
  display:inline-block; padding:0 .45em; border-radius:.6em; font-weight:700; line-height:1.15;
  background:#E5E7EB; color:var(--ink); box-shadow:0 0 0 1.5px #FFFFFF;
}
.multi{
  position:relative; flex:none; display:flex; align-items:center; gap:3px; height:18px; padding:0 5px 0 6px;
  background:transparent; border:1px solid var(--c-sub); border-radius:9px; color:var(--c-sub); opacity:.85;
}
.multi:hover{opacity:1}
.multi::after{content:""; position:absolute; inset:-6px -5px -5px -10px}   /* a bigger target than the control itself */
.multi .mn{font-size:11px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; min-width:.6em; text-align:center}
.multi i{display:none; width:var(--dot); height:var(--dot); border-radius:50%; background:var(--c-mark)}
.multi i:first-of-type{display:block}
.timer[data-multi="1"] .multi i:first-of-type{background:transparent; border:1.5px solid var(--c-sub)}
.timer[data-multi="2"] .multi i:nth-of-type(-n+2),.timer[data-multi="3"] .multi i{display:block}
.foot.tight .multi i{display:none !important}
.foot.tight .multi{padding:0 6px}
.timer[data-multi="2"] .multi,.timer[data-multi="3"] .multi{opacity:1; border-color:var(--c-mark); color:var(--c-mark); border-width:1.5px}
</style>
</head>
<body>
<div class="prog" id="prog" data-level="0" aria-hidden="true"><i></i></div>
<div class="bar">
  <button class="tally" id="tally" type="button" aria-label="Cases today" title="Cases today">0<span class="of">/102</span></button>
  <button class="ctl gear" id="gear" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Settings" title="Settings">
    <span class="tag" id="mode-tag" hidden></span>
    <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M19.64 9.64 L22.41 10.00 L22.41 14.00 L19.64 14.36 L19.08 15.73 L20.78 17.94 L17.94 20.78 L15.73 19.08 L14.36 19.64 L14.00 22.41 L10.00 22.41 L9.64 19.64 L8.27 19.08 L6.06 20.78 L3.22 17.94 L4.92 15.73 L4.36 14.36 L1.59 14.00 L1.59 10.00 L4.36 9.64 L4.92 8.27 L3.22 6.06 L6.06 3.22 L8.27 4.92 L9.64 4.36 L10.00 1.59 L14.00 1.59 L14.36 4.36 L15.73 4.92 L17.94 3.22 L20.78 6.06 L19.08 8.27Z M15.4 12a3.4 3.4 0 1 0-6.8 0a3.4 3.4 0 1 0 6.8 0Z"/></svg>
  </button>
  <button class="ctl" id="mute" type="button" data-level="off" aria-pressed="true" aria-label="Turn sound on" title="Turn sound on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path class="w1" d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path class="w2" d="M18.3 6.5a8 8 0 0 1 0 11"/><g class="x"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g></svg>
    </button>
</div>

<div class="menu" id="menu" role="menu" aria-label="Settings" hidden>
  <div class="row"><span class="row-k">Mode</span><div class="segs" role="group" aria-label="Mode">
    <button class="sb" id="mode-normal" type="button" role="menuitemradio" aria-checked="true" data-mode="normal" title="Closes around 207">Normal</button>
    <button class="sb" id="mode-lower" type="button" role="menuitemradio" aria-checked="false" data-mode="lower" title="Closes around 191">Lower</button>
    <button class="sb" id="mode-raise" type="button" role="menuitemradio" aria-checked="false" data-mode="raise" title="Closes at 219">Raise</button>
  </div></div>
  <div class="row"><span class="row-k">Timers</span><div class="segs" role="group" aria-label="Number of timers">
    <button class="sb" id="timers-1" type="button" role="menuitemradio" aria-checked="false" data-shown="1">1</button>
    <button class="sb" id="timers-2" type="button" role="menuitemradio" aria-checked="true" data-shown="2">2</button>
    <button class="sb" id="timers-3" type="button" role="menuitemradio" aria-checked="false" data-shown="3">3</button>
  </div></div>
  <div class="menu-msg" id="menu-msg" role="status" hidden></div>
  <div class="row"><span class="row-k">Goal</span><div class="segs" role="group" aria-label="Daily goal">
    <button class="sb" id="goal-102" type="button" role="menuitemradio" aria-checked="true" data-goal="102">Full · 102</button>
    <button class="sb" id="goal-90" type="button" role="menuitemradio" aria-checked="false" data-goal="90">Short · 90</button>
  </div></div>
  <div class="row"><span class="row-k">Volume</span><input class="vol" id="volume" type="range" min="0" max="100" step="1" value="25" aria-label="Alert volume" aria-valuetext="25%" title="Alert volume: 25%"><span class="row-v" id="vol-val">25%</span></div>
  <div class="sep"></div>
  <button class="opt" id="opt-hurry" type="button" role="menuitemcheckbox" aria-checked="false"><span class="mark box"></span><span class="opt-t">Hurry chime</span><span class="opt-s">at orange</span></button>
  <div class="row"><span class="row-k">Cases</span><span id="count-val" class="count-val">0 today</span><button class="small-btn" id="count-reset" type="button">Reset</button></div>
</div>

<div class="wrap">
  <main class="stage" id="stage">
    <section class="timer" aria-label="Timer 1" data-state="base" data-multi="1">
      <div class="numbox"><div class="num" role="timer" aria-label="Timer 1 seconds">0</div></div>
      <button class="go" id="go-1" type="button" aria-label="Start timer 1"><svg class="shape" aria-hidden="true"><path/></svg><span class="go-text">START</span></button>
      <div class="foot"><div class="last"><span class="last-k">Last:</span> –</div><button class="multi" id="multi-1" type="button" aria-label="Sub-cases: 1"><span class="mn">1</span><i></i><i></i><i></i></button><button class="undo" type="button" hidden>↶ UNDO</button></div>
    </section>
    <section class="timer" aria-label="Timer 2" data-state="base" data-multi="1">
      <div class="numbox"><div class="num" role="timer" aria-label="Timer 2 seconds">0</div></div>
      <button class="go" id="go-2" type="button" aria-label="Start timer 2"><svg class="shape" aria-hidden="true"><path/></svg><span class="go-text">START</span></button>
      <div class="foot"><div class="last"><span class="last-k">Last:</span> –</div><button class="multi" id="multi-2" type="button" aria-label="Sub-cases: 1"><span class="mn">1</span><i></i><i></i><i></i></button><button class="undo" type="button" hidden>↶ UNDO</button></div>
    </section>
    <section class="timer" aria-label="Timer 3" data-state="base" data-multi="1" hidden>
      <div class="numbox"><div class="num" role="timer" aria-label="Timer 3 seconds">0</div></div>
      <button class="go" id="go-3" type="button" aria-label="Start timer 3"><svg class="shape" aria-hidden="true"><path/></svg><span class="go-text">START</span></button>
      <div class="foot"><div class="last"><span class="last-k">Last:</span> –</div><button class="multi" id="multi-3" type="button" aria-label="Sub-cases: 1"><span class="mn">1</span><i></i><i></i><i></i></button><button class="undo" type="button" hidden>↶ UNDO</button></div>
    </section>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* ---------- rules ---------- */
  // Seconds on the timer at which each stage starts. Getting to the case tab takes about 2 s and a close about 6 s to load,
  // so "close now" comes 8 s before the time the case should show as closed.
  const MODES = {
    normal: { name: 'Normal',    tag: '',      go: 199, hurry: 211, over: 214 },   // closes around 207, never after 220
    lower:  { name: 'Lower AHT', tag: 'LOWER', go: 183, hurry: 191, over: 194 },   // closes around 191
    raise:  { name: 'Raise AHT', tag: 'RAISE', ready: 207, go: 213, over: 220 }    // wait on the case, press at 213, closes at 219
  };
  const COUNTDOWN = 3;                              // Raise: the button counts 3-2-1 before "close now"
  const T_BLACK = 370;                              // black card, button reads 3YE9TI
  const T_MAX = 999;                                // the count stops here until RESET
  // A multi-sensor case has 2 or 3 sub-cases to close: every stage starts earlier, by 3 s for the first sub-case
  // and 2 s for each one after it (x2 = 5 s earlier, x3 = 7 s earlier), so the last one still closes on target.
  const shiftFor = n => n > 1 ? 3 + 2 * (n - 1) : 0;
  const KEYS = ['go', 'second'];                    // the two sounds a run can have
  const BASE_TITLE = document.title;
  const CLOSE_TITLE = 'CLOSE Case';
  const NOTE_MS = 3000;
  const UNDO_MS = 5000;                     // how long a reset can be undone
  const MIN_CASE_S = 30;                    // a reset under 30 s is treated as a misclick and not counted
  const NEW_SHIFT_GAP = 6 * 3600 * 1000;    // no case for 6 hours: the next one starts a new day's count
  const GOALS = [102, 90];
  const MILESTONES = [[0.25, '25%'], [0.5, 'Halfway'], [0.75, '75%'], [1, 'Goal!']];
  const FLASH_MS = 3000;
  const CLICK_LOCK_MS = 300;   // a double-click can never reset-then-start (or start-then-reset)
  const MIN_NUM_PX = 40;

  /* ---------- state ---------- */
  const KEY = 'caseTimers.v1';
  const blank = () => ({ running: false, startedAt: null, capped: false, last: null, multi: 1, fired: {} });
  let timers = [blank(), blank(), blank()];
  let shown = 2;            // how many timers are on screen: 1, 2 or 3
  const MODE_KEY = 'caseTimers.mode';
  // The mode is kept for this browser tab only: a refresh keeps it, a newly opened page starts in Normal.
  let mode = (() => { try { const m = sessionStorage.getItem(MODE_KEY); return MODES[m] ? m : 'normal'; } catch (e) { return 'normal'; } })();
  let count = 0, lastCountAt = 0, goal = 102;   // today's case tally
  let hurryChime = false;   // second chime when a card turns orange
  const PREFS = 3;          // bumped when the sound defaults change, so the new default applies once
  const DEFAULT_VOLUME = 25;
  let volume = DEFAULT_VOLUME;      // 0 = off, 100 = loudest
  let lastVolume = DEFAULT_VOLUME;  // restored by the speaker button after muting
  const clampVol = v => Math.min(100, Math.max(0, Math.round(v)));
  // Square-law taper, like a hi-fi volume knob: the middle is a quarter of the signal (about half as loud as max).
  const gainFor = v => v <= 0 ? 0 : Math.pow(v / 100, 2);

  // A capped timer has stopped counting for good: it reads 999 whatever the clock says.
  const elapsed = (t, now) => !t.running ? 0 : t.capped ? T_MAX : Math.min(T_MAX, Math.max(0, Math.floor((now - t.startedAt) / 1000)));
  const anyRunning = () => timers.some(t => t.running && !t.capped);   // still counting

  // This timer's stage times under the current mode and its sub-case count.
  function plan(t) {
    const m = MODES[mode], k = shiftFor(t.multi);
    return mode === 'raise'
      ? { ready: m.ready - k, go: m.go - k, over: m.over - k }
      : { go: m.go - k, hurry: m.hurry - k, over: m.over - k };
  }
  function stageFor(t, s) {
    if (!t.running) return 'base';
    if (s >= T_BLACK) return 'black';
    const p = plan(t);
    if (s >= p.over) return 'red';
    if (p.hurry != null && s >= p.hurry) return 'orange';
    if (s >= p.go) return 'green';
    if (p.ready != null && s >= p.ready) return 'ready';
    return 'base';
  }
  function buttonText(t, s, state) {
    if (!t.running) return 'START';
    switch (state) {
      case 'black': return '3YE9TI';
      case 'green': return t.multi > 1 ? 'CLOSE ×' + t.multi : 'CLOSE NOW';
      case 'orange': return t.multi > 1 ? 'HURRY ×' + t.multi : 'HURRY';
      case 'ready': { const left = plan(t).go - s; return left <= COUNTDOWN ? String(left) : 'GET READY'; }
      default: return 'RESET';
    }
  }
  // The sounds of a run, in time order. Normal and Lower: a chime at green, and (if switched on) a short one at orange.
  // Raise: the chime says "go to the case", then a short beep says "press now".
  function eventsFor(t) {
    const p = plan(t);
    if (mode === 'raise') return [{ key: 'go', at: p.ready, sound: 'go' }, { key: 'second', at: p.go, sound: 'now' }];
    const list = [{ key: 'go', at: p.go, sound: 'go' }];
    if (hurryChime) list.push({ key: 'second', at: p.hurry, sound: 'hurry' });
    return list;
  }
  // A moment that has already passed counts as done: a sound never plays late, and never twice for the same moment.
  function refire(t, now) {
    t.fired = {};
    if (!t.running) return;
    const s = elapsed(t, now);
    for (const ev of eventsFor(t)) t.fired[ev.key] = s >= ev.at;
  }

  function cleanTimer(o) {
    const t = blank();
    if (!o || typeof o !== 'object') return t;
    if (Number.isFinite(o.last) && o.last >= 0) t.last = Math.floor(o.last);
    if (o.multi === 2 || o.multi === 3) t.multi = o.multi;
    if (o.running === true && Number.isFinite(o.startedAt) && o.startedAt > 0) {
      t.running = true;
      t.startedAt = o.startedAt;
      t.capped = o.capped === true;
    }
    return t;
  }
  function readStore() {
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ timers, shown, volume, lastVolume, hurryChime, count, lastCountAt, goal, prefs: PREFS })); } catch (e) { /* works without persistence */ }
  }
  function adopt(saved) {
    const list = saved && Array.isArray(saved.timers) ? saved.timers : [];
    timers = [cleanTimer(list[0]), cleanTimer(list[1]), cleanTimer(list[2])];
    shown = saved && [1, 2, 3].includes(saved.shown) ? saved.shown : (saved && saved.three === true ? 3 : 2);
    if (timers[2].running) shown = 3;                      // a running timer is never hidden
    else if (timers[1].running && shown < 2) shown = 2;
    for (let i = shown; i < 3; i++) timers[i] = blank();
    hurryChime = !!(saved && saved.hurryChime === true);
    if (saved && saved.prefs === PREFS) {
      if (Number.isFinite(saved.volume)) volume = clampVol(saved.volume);
      if (Number.isFinite(saved.lastVolume) && saved.lastVolume > 0) lastVolume = clampVol(saved.lastVolume);
    } else { volume = DEFAULT_VOLUME; lastVolume = DEFAULT_VOLUME; }   // first open, or settings from before this default
    goal = saved && GOALS.includes(saved.goal) ? saved.goal : 102;
    count = saved && Number.isFinite(saved.count) && saved.count > 0 ? Math.floor(saved.count) : 0;
    lastCountAt = saved && Number.isFinite(saved.lastCountAt) ? saved.lastCountAt : 0;
    if (count && Date.now() - lastCountAt > NEW_SHIFT_GAP) count = 0;   // yesterday's count
    // Moments already passed while the page was closed count as done: never replay them.
    const now = Date.now();
    let changed = false;
    for (const t of timers) {
      refire(t, now);
      if (t.running && elapsed(t, now) >= T_MAX && !t.capped) { t.capped = true; changed = true; }
    }
    return changed;
  }

  /* ---------- elements ---------- */
  const ui = [...document.querySelectorAll('.timer')].map(root => ({
    root,
    numbox: root.querySelector('.numbox'),
    num: root.querySelector('.num'),
    btn: root.querySelector('.go'),
    btnText: root.querySelector('.go-text'),
    last: root.querySelector('.last'),
    multi: root.querySelector('.multi'),
    shape: root.querySelector('.go .shape'),
    shapeKey: '',
    shown: null,
    undo: root.querySelector('.undo'),
    undoRec: null,
    undoTimer: 0,
    lockUntil: 0
  }));
  const muteBtn = document.getElementById('mute');
  const shownOpts = [...document.querySelectorAll('[data-shown]')];
  const menuMsg = document.getElementById('menu-msg');
  let msgTimer = 0;
  const volEl = document.getElementById('volume');
  const gearBtn = document.getElementById('gear');
  const menu = document.getElementById('menu');
  const tagEl = document.getElementById('mode-tag');
  const modeOpts = [...menu.querySelectorAll('[data-mode]')];
  const hurryOpt = document.getElementById('opt-hurry');
  const tallyEl = document.getElementById('tally');
  const progEl = document.getElementById('prog');
  const goalOpts = [...menu.querySelectorAll('[data-goal]')];
  const countVal = document.getElementById('count-val');
  const countReset = document.getElementById('count-reset');
  const volVal = document.getElementById('vol-val');
  let flash = null, flashTimer = 0, armTimer = 0;

  /* ---------- audio (Web Audio only) ---------- */
  let ctx = null, master = null, suspendTimer = 0;
  const sched = [{}, {}, {}];
  const audioOn = () => !!ctx && ctx.state === 'running';

  function ensureAudio() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = gainFor(volume);
        master.connect(ctx.destination);

  muteBtn.addEventListener('click', e => {
    if (volume > 0) { lastVolume = volume; volume = 0; stopPreview(); }
    else volume = lastVolume > 0 ? lastVolume : DEFAULT_VOLUME;
    save();
    paintControls();
    if (e.detail > 0) muteBtn.blur();
  });
  // Dragging changes the level live; letting go saves it and plays the chime at that level.
  volEl.addEventListener('input', () => {
    volume = clampVol(+volEl.value);
    if (volume === 0) stopPreview();
    paintControls();
  });
  volEl.addEventListener('change', () => {
    volume = clampVol(+volEl.value);
    if (volume > 0) lastVolume = volume;
    save();
    paintControls();
    playPreview();
  });
  volEl.addEventListener('pointerup', () => setTimeout(() => volEl.blur(), 0));

  // Settings: the mode applies at once, to running timers too, and is kept until this tab is closed.
  gearBtn.addEventListener('click', e => {
    openMenu(menu.hidden);
    if (e.detail > 0) gearBtn.blur();
  });
  tallyEl.addEventListener('click', e => {
    openMenu(menu.hidden);
    if (e.detail > 0) tallyEl.blur();
  });
  goalOpts.forEach(o => o.addEventListener('click', () => {
    goal = +o.dataset.goal;
    flash = null;
    save();
    paintTally();
  }));
  // Resetting the count takes two taps, so it can't happen by accident.
  countReset.addEventListener('click', e => {
    if (!countReset.classList.contains('armed')) {
      countReset.classList.add('armed');
      countReset.textContent = 'Sure?';
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { countReset.classList.remove('armed'); countReset.textContent = 'Reset'; }, 3000);
      return;
    }
    clearTimeout(armTimer);
    countReset.classList.remove('armed');
    countReset.textContent = 'Reset';
    count = 0; lastCountAt = 0; flash = null;
    ui.forEach((_, i) => clearUndo(i));
    save();
    paintTally();
    if (e.detail > 0) countReset.blur();
  });
  modeOpts.forEach(o => o.addEventListener('click', () => {
    tick();
    mode = o.dataset.mode;
    try { sessionStorage.setItem(MODE_KEY, mode); } catch (e) { /* the mode then lasts until the page reloads */ }
    paintSettings();
    replan(timers);
    openMenu(false);
  }));
  hurryOpt.addEventListener('click', e => {
    tick();
    hurryChime = !hurryChime;
    save();
    paintSettings();
    replan(timers);
    if (e.detail > 0) hurryOpt.blur();
  });
  document.addEventListener('click', e => {
    if (!menu.hidden && !menu.contains(e.target) && !gearBtn.contains(e.target) && !tallyEl.contains(e.target)) openMenu(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) openMenu(false); });

  // First click anywhere unlocks audio and the wake lock (runs before the button's own handler).
  document.addEventListener('click', () => {
    touched = true;
    if (!ctx || anyRunning()) ensureAudio();
    restAudio();
    keepAwake();
    setTimeout(showAudioHint, 500);
  }, true);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    tick();
    keepAwake();
    queueFit();
  });
  window.addEventListener('pageshow', () => { tick(); queueFit(); });
  window.addEventListener('resize', queueFit);
  if ('ResizeObserver' in window) new ResizeObserver(queueFit).observe(document.getElementById('stage'));

  // Another window of this page changed the timers: follow it.
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    if (adopt(readStore())) save();
    paintAll();
    tick();
    restAudio();
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());

  /* ---------- boot ---------- */
  if (adopt(readStore())) save();
  paintAll();
  tick();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 100px "Case Digits"', '0123456789').then(() => { measure(); fit(); }, () => { measure(); fit(); });
  } else { measure(); fit(); }
})();
</script>
</body>
</html>
